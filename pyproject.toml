[project]
name = "asnwero-bot"
version = "0.1.0"
description = "Telegram MVP bot that suggests three reply variants in a selected tone."
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

[project.scripts]
asnwero-bot = "asnwero_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

